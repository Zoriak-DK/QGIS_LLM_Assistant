name: Build QGIS plugin ZIP

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of the release to upload the plugin ZIP to
        required: true
        type: string
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        id: package
        run: |
          version="$(sed -n 's/^version=//p' qgis_ai_assistant/metadata.txt | head -n 1)"
          if [ -z "$version" ]; then
            echo "Could not read plugin version from qgis_ai_assistant/metadata.txt" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          zip -r "Assistant_IA_QGIS_v${version}.zip" qgis_ai_assistant \
            -x '*/__pycache__/*' '*.pyc' '*/.DS_Store' '*.backup'

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Assistant_IA_QGIS_v${{ steps.package.outputs.version }}
          path: Assistant_IA_QGIS_v${{ steps.package.outputs.version }}.zip
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin ZIP
        uses: actions/download-artifact@v4
        with:
          name: Assistant_IA_QGIS_v${{ needs.build.outputs.version }}

      - name: Attach plugin ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "Assistant_IA_QGIS_v${{ needs.build.outputs.version }}.zip" --repo "$GITHUB_REPOSITORY" --clobber
